name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: ut run format:check
      - run: ut run lint
      - run: ut run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: ut run test:coverage

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: ut run build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag react-project-template:ci .
      - name: Start test backend
        run: |
          mkdir -p "$RUNNER_TEMP/container-api-v1/api" "$RUNNER_TEMP/container-api-v2/api"
          printf 'proxy-ok\n' > "$RUNNER_TEMP/container-api-v1/api/test"
          printf 'proxy-recovered\n' > "$RUNNER_TEMP/container-api-v2/api/test"
          docker network create react-project-template-ci
          docker run --detach \
            --name react-project-template-api \
            --network react-project-template-ci \
            --volume "$RUNNER_TEMP/container-api-v1:/usr/share/nginx/html:ro" \
            nginx:1.30.4-alpine3.24

          for attempt in {1..10}; do
            if docker exec react-project-template-api wget --quiet --spider http://127.0.0.1/api/test; then
              break
            fi
            sleep 1
          done

          docker exec react-project-template-api wget --quiet --spider http://127.0.0.1/api/test
      - name: Start production container
        run: |
          docker run --detach \
            --name react-project-template-ci \
            --network react-project-template-ci \
            --publish 8080:80 \
            --env API_UPSTREAM=http://react-project-template-api \
            react-project-template:ci
      - name: Verify production container
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then
              break
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:8080/healthz
          curl --fail --silent --show-error http://127.0.0.1:8080/roles | grep --fixed-strings '<div id="root"></div>'
          curl --silent --show-error --head http://127.0.0.1:8080/index.html | grep --ignore-case 'Cache-Control: no-cache'

          asset_path=$(docker exec react-project-template-ci sh -c 'find /usr/share/nginx/html/assets -type f | head -n 1')
          asset_path=${asset_path#/usr/share/nginx/html}
          curl --silent --show-error --head "http://127.0.0.1:8080${asset_path}" | grep --ignore-case 'Cache-Control: public, max-age=31536000, immutable'

          test "$(curl --fail --silent --show-error http://127.0.0.1:8080/api/test)" = proxy-ok
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/missing)" = 404
      - name: Verify backend DNS refresh
        run: |
          old_backend_ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' react-project-template-api)
          docker rm --force react-project-template-api
          docker run --detach \
            --name react-project-template-api-old-ip \
            --network react-project-template-ci \
            --ip "$old_backend_ip" \
            --volume "$RUNNER_TEMP/container-api-v1:/usr/share/nginx/html:ro" \
            nginx:1.30.4-alpine3.24
          docker run --detach \
            --name react-project-template-api \
            --network react-project-template-ci \
            --volume "$RUNNER_TEMP/container-api-v2:/usr/share/nginx/html:ro" \
            nginx:1.30.4-alpine3.24

          new_backend_ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' react-project-template-api)
          test "$new_backend_ip" != "$old_backend_ip"

          for attempt in {1..20}; do
            if test "$(curl --fail --max-time 2 --silent http://127.0.0.1:8080/api/test || true)" = proxy-recovered; then
              break
            fi
            sleep 1
          done

          test "$(curl --fail --max-time 5 --silent --show-error http://127.0.0.1:8080/api/test)" = proxy-recovered
      - if: failure()
        name: Print container logs
        run: |
          docker logs react-project-template-api || true
          docker logs react-project-template-api-old-ip || true
          docker logs react-project-template-ci || true
      - if: always()
        name: Remove test containers
        run: |
          docker rm --force react-project-template-api react-project-template-api-old-ip react-project-template-ci 2>/dev/null || true
          docker network rm react-project-template-ci 2>/dev/null || true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: ut execute playwright install --with-deps chromium
      - run: ut run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  ci:
    if: always()
    needs:
      - lint
      - test
      - build
      - container
      - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check required jobs
        run: |
          test '${{ needs.lint.result }}' = success
          test '${{ needs.test.result }}' = success
          test '${{ needs.build.result }}' = success
          test '${{ needs.container.result }}' = success
          test '${{ needs.e2e.result }}' = success
