version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '05:00'
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    groups:
      dependencies:
        dependency-type: production
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
