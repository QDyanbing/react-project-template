name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: ut run format:check
      - run: ut run lint
      - run: ut run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: ut run test:coverage

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: ut run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: ut execute playwright install --with-deps chromium
      - run: ut run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  ci:
    if: always()
    needs:
      - lint
      - test
      - build
      - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check required jobs
        run: |
          test '${{ needs.lint.result }}' = success
          test '${{ needs.test.result }}' = success
          test '${{ needs.build.result }}' = success
          test '${{ needs.e2e.result }}' = success
